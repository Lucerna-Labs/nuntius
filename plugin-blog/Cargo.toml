[package]
name = "ccc-plugin-blog"
version = "0.1.0"
edition = "2021"

[dependencies]
ccc-core = { path = "../core" }
ccc-database = { path = "../database" }
ccc-plugin-utils = { path = "../ccc-plugin-utils" }

axum = { version = "0.7.9", features = ["macros"] }
askama = "0.12"
askama_axum = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = "0.13"
# Sanitizes the rendered post HTML before it hits the `safe` filter —
# markdown passes raw HTML through, so without this a compromised
# operator account could store XSS in a post body.
ammonia = "4"
