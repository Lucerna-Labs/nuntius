<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog — {{ site_name }}</title>
  <meta name="description" content="Latest posts from {{ site_name }}.">
  <meta name="theme-color" content="#07090d">
  <meta property="og:title" content="Blog — {{ site_name }}">
  <meta property="og:type" content="website">
  <meta property="og:description" content="Latest posts from {{ site_name }}.">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/public.css">
  <style>
    /* --- Blog index -------------------------------------------------------- */
    .blog-head { padding: 40px 0 4px; max-width: 760px; }
    .blog-head h1 { font-size: clamp(30px, 4.6vw, 44px); margin: 12px 0 0; }
    .post-list { list-style: none; margin: 22px 0 0; padding: 0; max-width: 760px; }
    .post-list li { border-bottom: 1px solid var(--line); }
    .post-list a {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 18px;
      padding: 18px 4px;
      color: var(--ink);
    }
    .post-list h2 { margin: 0; font-size: 19px; line-height: 1.35; transition: color 0.15s; }
    .post-list a:hover h2 { color: var(--signal-hot); }
    .post-list .when {
      font: 500 12px/1 var(--font-mono);
      letter-spacing: 0.06em;
      color: var(--ink-faint);
      white-space: nowrap;
      flex-shrink: 0;
    }
    @media (max-width: 560px) {
      .post-list a { flex-direction: column; align-items: flex-start; gap: 8px; }
    }
  </style>
</head>
<body class="nuntius-public">
  <div class="pub-wrap">
    <header class="pub-top">
      <a class="pub-brand" href="/">{{ site_name }}</a>
      <nav class="pub-nav" aria-label="Site">
        <a href="/radio">Live radio</a>
        <a href="/podcasts">Podcasts</a>
        <a href="/videos">Video</a>
        <a href="/blog/" aria-current="page">Blog</a>
      </nav>
    </header>

    <main>
      <div class="blog-head">
        <span class="pub-kicker">From the station</span>
        <h1>Blog</h1>
      </div>
      {% if posts.is_empty() %}
        <div class="pub-empty" style="max-width: 760px; margin-top: 22px;">No posts published yet.</div>
      {% else %}
        <ul class="post-list">
          {% for p in posts %}
            <li>
              <a href="/blog/{{ p.slug }}">
                <h2>{{ p.title }}</h2>
                <span class="when">{{ p.published_human }}</span>
              </a>
            </li>
          {% endfor %}
        </ul>
      {% endif %}
    </main>

    <footer class="pub-footer">
      <span>Powered by Nuntius</span>
      <span><a href="/podcasts/feed.xml">Podcast RSS</a></span>
    </footer>
  </div>
</body>
</html>
