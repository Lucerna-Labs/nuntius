[package]
name = "ccc-radio-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
ccc-core = { path = "../core" }
ccc-database = { path = "../database" }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }

axum = { version = "0.7.9", features = ["macros", "multipart"] }
askama = "0.12"
askama_axum = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bytes = "1"
base64 = "0.22"
rand = "0.8"

# Audio metadata extraction (artist, title, duration, bitrate from MP3/M4A/FLAC).
lofty = "0.21"

# URL parsing for the relay client.
url = "2"
