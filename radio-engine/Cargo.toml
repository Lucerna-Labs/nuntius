[package]
name = "ccc-radio-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
ccc-core = { path = "../core" }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }

axum = { version = "0.7.9", features = ["macros"] }
askama = "0.12"
askama_axum = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
bytes = "1"
base64 = "0.22"
