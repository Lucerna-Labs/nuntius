[package]
name = "ccc-core"
version = "0.1.0"
edition = "2021"

[dependencies]
ccc-database = { path = "../database" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
axum = "0.7.9"
toml = "0.8"
tokio = { version = "1.0", features = ["sync"] }
tracing = "0.1"
