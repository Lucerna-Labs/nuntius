[package]
name = "ccc-plugin-activitypub"
version = "0.1.0"
edition = "2021"

[dependencies]
ccc-core = { path = "../core" }
ccc-database = { path = "../database" }

axum = { version = "0.7.9", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
askama = "0.12"
askama_axum = "0.4"
