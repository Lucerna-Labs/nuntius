# Creator Command Center (CCC) — runtime configuration.
#
# This file decides which plugins are CONSTRUCTED at startup. Plugins not
# listed in `[plugins].enabled` are NOT instantiated: no memory, no routes,
# no background tasks. "Disabled" means absent, not idle.
#
# Run `ccc-cli plugins` to see the full list of plugins this build knows.

[server]
host = "0.0.0.0"
port = 3000

[database]
path = "ccc.redb"

[plugins]
# Default-on: CMS (so non-technical operators can manage everything)
# plus the substantive content plugins. Add more as you flesh them out.
enabled = [
    "cms",
    "blog",
    "podcast",
    "video-podcast",
    "activitypub",
]

# Per-plugin configuration goes under [plugin.<name>]. Plugins read the
# subtable they own; everything else is ignored.

[plugin.cms]
# Sidecar file holding the (argon2) admin password and cookie-signing key.
# Created automatically on first run; the setup wizard at /admin/setup
# writes the admin account into it.
admin_store_path = "admin.toml"

[plugin.video-podcast]
# Directory that holds the HLS playlists and segments served at /video/hls/*.
hls_dir = "./hls"

[plugin.activitypub]
# Where the federation actor settings (username, host, bio, public key) live.
# Created on first boot; edit via /admin/federation in the browser.
settings_path = "federation.toml"
