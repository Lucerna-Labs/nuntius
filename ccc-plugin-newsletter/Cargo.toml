[package]
name = "ccc-plugin-newsletter"
version = "0.1.0"
edition = "2021"

[dependencies]
ccc-core = { path = "../core" }
ccc-database = { path = "../database" }

axum = { version = "0.7.9", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
askama = "0.12"
askama_axum = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# SMTP delivery — async, rustls so we don't need OpenSSL.
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
