<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscribe — Nuntius</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
  <style>
    .nl-public { max-width: 520px; margin: 80px auto; padding: 24px; }
  </style>
</head>
<body class="cms">
  <main class="nl-public">
    <h1>Subscribe</h1>
    {% match success %}
      {% when Some with (_) %}
        <div class="cms-alert" style="background: rgba(91, 158, 255, 0.12); color: var(--accent); padding: 10px 12px; border-radius: 6px; margin-bottom: 16px;">
          You're on the list.
        </div>
      {% when None %}
    {% endmatch %}
    {% match error %}
      {% when Some with (msg) %}
        <div class="cms-alert cms-alert--error">{{ msg }}</div>
      {% when None %}
    {% endmatch %}

    <form method="post" action="/newsletter/subscribe" class="cms-form">
      <label class="cms-field">
        <span class="cms-field__label">Your email</span>
        <input class="cms-field__input" type="email" name="email" required autocomplete="email">
      </label>
      <button class="cms-btn cms-btn--primary" type="submit">Subscribe</button>
    </form>
  </main>
</body>
</html>
