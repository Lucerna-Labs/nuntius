{% extends "_admin_layout.html" %}

{% block title %}SMTP — Newsletter — Creator Command Center{% endblock %}

{% block content %}
<header class="cms-page__header">
  <h1>SMTP settings</h1>
  <p class="cms-page__lede">Used to send newsletter emails.</p>
</header>

{% match saved %}
  {% when Some with (_) %}
    <div class="cms-alert" style="background: rgba(91, 158, 255, 0.12); color: var(--accent); padding: 10px 12px; border-radius: 6px; margin-bottom: 16px;">Saved.</div>
  {% when None %}
{% endmatch %}

<form method="post" action="/admin/newsletter/settings" class="cms-form" style="max-width:640px">
  <label class="cms-field">
    <span class="cms-field__label">SMTP host</span>
    <input class="cms-field__input" type="text" name="host" value="{{ host }}" required
           placeholder="smtp.example.com">
  </label>
  <label class="cms-field">
    <span class="cms-field__label">SMTP port</span>
    <input class="cms-field__input" type="number" name="port" value="{{ port }}" required min="1" max="65535">
    <span class="cms-field__hint">587 (STARTTLS) or 465 (implicit TLS) for most providers.</span>
  </label>
  <label class="cms-field">
    <span class="cms-field__label">Username</span>
    <input class="cms-field__input" type="text" name="username" value="{{ username }}" autocomplete="off">
  </label>
  <label class="cms-field">
    <span class="cms-field__label">Password</span>
    <input class="cms-field__input" type="password" name="password" value="{{ password }}" autocomplete="new-password">
  </label>
  <label class="cms-field">
    <span class="cms-field__label">From address</span>
    <input class="cms-field__input" type="email" name="from_email" value="{{ from_email }}" required>
  </label>
  <label class="cms-field">
    <span class="cms-field__label">From name</span>
    <input class="cms-field__input" type="text" name="from_name" value="{{ from_name }}" required>
  </label>
  <button class="cms-btn cms-btn--primary" type="submit">Save</button>
</form>
{% endblock %}
