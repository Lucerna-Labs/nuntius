[package]
name = "azuracast-plugin-video-podcast"
version = "0.1.0"
edition = "2021"

[dependencies]
azuracast-core = { path = "../core" }
azuracast-database = { path = "../database" }
tokio = { version = "1.0", features = ["full"] }
axum = "0.7.9"
serde = { version = "1.0", features = ["derive"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
