<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} — Video</title>
  <meta name="description" content="{{ description }}">
  <meta name="theme-color" content="#07090d">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:type" content="video.episode">
  <meta property="og:description" content="{{ description }}">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/public.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    /* --- Video page ----------------------------------------------------------- */
    .video-page { max-width: 960px; margin: 34px auto 0; }
    .video-page h1 { font-size: clamp(26px, 4vw, 40px); line-height: 1.15; margin: 12px 0 0; }
    .video-page video {
      width: 100%;
      margin-top: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--bg-deep);
    }
    .video-page .desc { margin-top: 20px; color: var(--ink-dim); white-space: pre-wrap; }
  </style>
</head>
<body class="nuntius-public">
  <div class="pub-wrap">
    <header class="pub-top">
      <a class="pub-brand" href="/">{{ site_name }}</a>
      <nav class="pub-nav" aria-label="Site">
        <a href="/radio">Live radio</a>
        <a href="/podcasts">Podcasts</a>
        <a href="/videos" aria-current="page">Video</a>
        <a href="/blog/">Blog</a>
      </nav>
    </header>

    <main class="video-page">
      <p style="margin: 0;"><a href="/videos">← All video</a></p>
      <span class="pub-kicker">Video · {{ published_human }}{% if duration != "00:00" %} · {{ duration }}{% endif %}</span>
      <h1>{{ title }}</h1>
      <video id="video" controls></video>
      <p class="desc">{{ description }}</p>
    </main>

    <footer class="pub-footer">
      <span>Powered by Nuntius</span>
      <span><a href="/podcasts/feed.xml">Podcast RSS</a></span>
    </footer>
  </div>

  <script>
    if (Hls.isSupported()) {
      var hls = new Hls();
      hls.loadSource('/videos/hls/{{ hls_dir }}/master.m3u8');
      hls.attachMedia(document.getElementById('video'));
    } else {
      document.getElementById('video').src = '/videos/hls/{{ hls_dir }}/master.m3u8';
    }
  </script>
</body>
</html>
