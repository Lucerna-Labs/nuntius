[package]
name = "ccc-plugin-live-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
ccc-core = { path = "../core" }
ccc-plugin-utils = { path = "../ccc-plugin-utils" }

axum = { version = "0.7.9", features = ["macros", "ws"] }
tokio = { version = "1.0", features = ["full", "sync", "time", "io-util", "net", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
askama = "0.12"
askama_axum = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
futures = "0.3"
async-stream = "0.3"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time", "test-util"] }
