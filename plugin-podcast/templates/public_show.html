<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} — Podcast</title>
  <meta name="description" content="{{ description }}">
  <meta name="theme-color" content="#07090d">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:type" content="music.song">
  <meta property="og:description" content="{{ description }}">
  <meta name="twitter:card" content="summary">
  <link rel="alternate" type="application/rss+xml" title="Nuntius Podcast" href="/podcasts/feed.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/public.css">
  <style>
    /* --- Episode page ------------------------------------------------------- */
    .episode { max-width: 760px; margin: 34px auto 0; }
    .episode h1 { font-size: clamp(26px, 4vw, 40px); line-height: 1.15; margin: 12px 0 0; }
    .episode audio { width: 100%; margin-top: 24px; }
    .episode .desc { margin-top: 20px; color: var(--ink-dim); white-space: pre-wrap; }
    .episode .actions { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 26px; }
  </style>
</head>
<body class="nuntius-public">
  <div class="pub-wrap">
    <header class="pub-top">
      <a class="pub-brand" href="/">Nuntius</a>
      <nav class="pub-nav" aria-label="Site">
        <a href="/radio">Live radio</a>
        <a href="/podcasts" aria-current="page">Podcasts</a>
        <a href="/videos">Video</a>
        <a href="/blog/">Blog</a>
      </nav>
    </header>

    <main class="episode">
      <p style="margin: 0;"><a href="/podcasts">← All podcasts</a></p>
      <span class="pub-kicker">Episode · {{ published_human }}{% if duration != "00:00" %} · {{ duration }}{% endif %}</span>
      <h1>{{ title }}</h1>
      <audio controls preload="metadata" src="/podcasts/download/{{ id }}"></audio>
      <p class="desc">{{ description }}</p>
      <div class="actions">
        <a class="pub-btn" href="/podcasts/download/{{ id }}" download>Download episode</a>
        <a href="/podcasts/feed.xml">RSS feed →</a>
      </div>
    </main>

    <footer class="pub-footer">
      <span>Powered by Nuntius</span>
      <span><a href="/podcasts/feed.xml">Podcast RSS</a></span>
    </footer>
  </div>
</body>
</html>
