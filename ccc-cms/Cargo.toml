[package]
name = "ccc-cms"
version = "0.1.0"
edition = "2021"
description = "Content Management System for the Creator Command Center"

[dependencies]
ccc-core = { path = "../core" }
ccc-database = { path = "../database" }

axum = { version = "0.7.9", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tower-cookies = { version = "0.10", features = ["signed"] }

# Templating: askama is compile-time, no runtime cost.
askama = "0.12"
askama_axum = "0.4"

# Auth + crypto.
argon2 = "0.5"
rand = "0.8"
rand_core = "0.6"

# Serialization.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Time + utilities.
time = { version = "0.3", features = ["serde", "macros"] }
