[package]
name = "ccc-plugin-mail"
version = "0.1.0"
edition = "2021"

[dependencies]
ccc-core = { path = "../core" }
ccc-plugin-utils = { path = "../ccc-plugin-utils" }
axum = "0.7"
askama = "0.12"
askama_axum = "0.4"
ammonia = "4"
imap = "2.4"
imap-proto = "0.10"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls", "hostname"] }
mailparse = "0.15"
native-tls = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
