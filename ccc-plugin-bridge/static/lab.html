<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuntius Bridge Lab</title><style>body{margin:0;background:#11151b;color:#e8edf2;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:940px;margin:0 auto;padding:32px 20px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{margin:0;font-size:28px;letter-spacing:0}.lede{margin:8px 0 0;color:#9aa7b5;max-width:640px}
.actions{display:flex;gap:10px;flex-wrap:wrap}button,a.btn{border:1px solid #2e3b49;background:#1d2630;color:#e8edf2;border-radius:6px;padding:10px 14px;text-decoration:none;cursor:pointer}
button.primary{background:#54d6c6;color:#071011;border-color:#54d6c6;font-weight:700}button:disabled{opacity:.55;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0}
.card{border:1px solid #25313d;background:#151b22;border-radius:8px;padding:14px;min-height:72px}
.label{color:#7f8d9c;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:20px;margin-top:7px;word-break:break-word}
.panel{border:1px solid #25313d;background:#151b22;border-radius:8px;padding:16px;margin-top:16px}
pre{min-height:300px;max-height:480px;overflow:auto;margin:0;white-space:pre-wrap;color:#b8c5d1;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.ok{color:#54d6c6}.warn{color:#f4c35a}.bad{color:#ff7979}
@media (max-width:760px){header{display:block}.actions{margin-top:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main>
<header><div><h1>Bridge lab</h1><p class="lede">Runs a full local bridge/client handshake in one page while still using Nuntius rendezvous APIs for bridge ads, SDP answers, and ICE exchange.</p></div><div class="actions"><a class="btn" href="/admin/bridge">Admin</a><button id="runBtn" class="primary">Run self-test</button></div></header>
<section class="grid"><div class="card"><div class="label">Bridge ID</div><div id="bridgeId" class="value">-</div></div><div class="card"><div class="label">Session</div><div id="sessionId" class="value">-</div></div><div class="card"><div class="label">Channel</div><div id="channelState" class="value">closed</div></div><div class="card"><div class="label">Result</div><div id="testState" class="value">waiting</div></div></section>
<section class="panel"><pre id="log"></pre></section>
</main><script>
const $=id=>document.getElementById(id);
const logLine=(m,c='')=>{const el=$('log'); const t=new Date().toLocaleTimeString(); el.innerHTML+=`<span class="${c}">[${t}] ${m}</span>\n`; el.scrollTop=el.scrollHeight;};
const api=async(path,opts={})=>{const r=await fetch(path,{...opts,headers:{'content-type':'application/json',...(opts.headers||{})}}); if(!r.ok) throw new Error(`${path} ${r.status}`); if(r.status===204) return null; return r.json();};
const enc=new TextEncoder(), dec=new TextDecoder();
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let key=null;
async function ensureKey(){ if(!key) key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']); return key; }
async function encryptText(text){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await ensureKey(),enc.encode(text)); return b64(new Uint8Array([...iv,...new Uint8Array(ct)])); }
async function decryptText(packet){ const bytes=unb64(packet); const iv=bytes.slice(0,12); const ct=bytes.slice(12); const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},await ensureKey(),ct); return dec.decode(pt); }
function setText(id,v){$(id).textContent=v||'-';}
async function waitFor(fn, label, ms=10000){
  const start=Date.now();
  while(Date.now()-start<ms){ const v=await fn(); if(v) return v; await new Promise(r=>setTimeout(r,100)); }
  throw new Error(`timeout waiting for ${label}`);
}
async function run(){
  if(typeof RTCPeerConnection!=='function') throw new Error('WebRTC RTCPeerConnection is not available in this browser');
  $('runBtn').disabled=true; setText('testState','running');
  const bridgeAd=await api('/api/bridge/advertise',{method:'POST',body:JSON.stringify({transport:'webrtc-datachannel-lab',capacity:1,ttl_secs:300})});
  const bridgeId=bridgeAd.bridge_id; setText('bridgeId',bridgeId); logLine(`advertised ${bridgeId}`,'ok');
  const clientPc=new RTCPeerConnection({iceServers:[]});
  const bridgePc=new RTCPeerConnection({iceServers:[]});
  let sessionId=null, nextClientIce=0, nextBridgeIce=0, queuedClientIce=[], queuedBridgeIce=[];
  async function postClientCandidate(candidate){ if(!sessionId){ queuedClientIce.push(candidate); return; } await api(`/api/bridge/sessions/${sessionId}/client-ice`,{method:'POST',body:JSON.stringify({candidate})}); }
  async function postBridgeCandidate(candidate){ if(!sessionId){ queuedBridgeIce.push(candidate); return; } await api(`/api/bridge/sessions/${sessionId}/bridge-ice`,{method:'POST',body:JSON.stringify({candidate})}); }
  async function flushIce(){ const c=queuedClientIce.splice(0); for(const candidate of c) await postClientCandidate(candidate); const b=queuedBridgeIce.splice(0); for(const candidate of b) await postBridgeCandidate(candidate); }
  clientPc.onicecandidate=e=>{ if(e.candidate) postClientCandidate(e.candidate.toJSON()).catch(err=>logLine(err.message,'bad')); };
  bridgePc.onicecandidate=e=>{ if(e.candidate) postBridgeCandidate(e.candidate.toJSON()).catch(err=>logLine(err.message,'bad')); };
  const dc=clientPc.createDataChannel('nuntius-bridge',{ordered:true});
  let testResolve, testReject;
  const testDone=new Promise((res,rej)=>{testResolve=res; testReject=rej;});
  bridgePc.ondatachannel=e=>{
    const ch=e.channel;
    ch.onopen=()=>{ logLine('bridge data channel open','ok'); };
    ch.onmessage=evt=>{
      const msg=JSON.parse(evt.data);
      if(msg.type==='ciphertext'){ logLine(`bridge saw opaque frame ${msg.id}`); ch.send(JSON.stringify({type:'ciphertext-echo',id:msg.id,bytes:msg.bytes})); }
    };
  };
  dc.onopen=async()=>{
    setText('channelState','open'); logLine('client data channel open','ok');
    const clear='Nuntius bridge lab encrypted frame';
    const bytes=await encryptText(clear);
    dc.send(JSON.stringify({type:'ciphertext',id:'lab-frame',bytes}));
    dc.onmessage=async evt=>{
      const msg=JSON.parse(evt.data);
      const got=await decryptText(msg.bytes);
      if(got===clear){ setText('testState','passed'); logLine('encrypted frame verified after peer echo','ok'); testResolve(true); }
      else { setText('testState','failed'); testReject(new Error('decrypted payload mismatch')); }
    };
  };
  const offer=await clientPc.createOffer();
  await clientPc.setLocalDescription(offer);
  const created=await api('/api/bridge/sessions',{method:'POST',body:JSON.stringify({bridge_id:bridgeId,ttl_secs:300,offer:{sdp_type:offer.type,sdp:offer.sdp}})});
  sessionId=created.session_id; setText('sessionId',sessionId); logLine(`created session ${sessionId}`,'ok');
  await flushIce();
  const pending=await waitFor(async()=>{ const rows=await api(`/api/bridge/bridges/${bridgeId}/sessions`); return rows.find(r=>r.session_id===sessionId); }, 'pending session');
  await bridgePc.setRemoteDescription({type:pending.offer.sdp_type,sdp:pending.offer.sdp});
  for(const c of pending.client_ice||[]) await bridgePc.addIceCandidate(c).catch(()=>{});
  const answer=await bridgePc.createAnswer();
  await bridgePc.setLocalDescription(answer);
  await api(`/api/bridge/sessions/${sessionId}/answer`,{method:'POST',body:JSON.stringify({answer:{sdp_type:answer.type,sdp:answer.sdp}})});
  await flushIce();
  const answerRes=await waitFor(async()=>{ const res=await api(`/api/bridge/sessions/${sessionId}/answer`); return res.ready ? res : null; }, 'answer');
  await clientPc.setRemoteDescription({type:answerRes.answer.sdp_type,sdp:answerRes.answer.sdp});
  const icePump=setInterval(async()=>{
    try{
      const ci=await api(`/api/bridge/sessions/${sessionId}/client-ice?from=${nextClientIce}`); nextClientIce=ci.next; for(const c of ci.candidates) await bridgePc.addIceCandidate(c).catch(()=>{});
      const bi=await api(`/api/bridge/sessions/${sessionId}/bridge-ice?from=${nextBridgeIce}`); nextBridgeIce=bi.next; for(const c of bi.candidates) await clientPc.addIceCandidate(c).catch(()=>{});
    }catch(e){ logLine(e.message,'bad'); }
  },100);
  await Promise.race([testDone,new Promise((_,rej)=>setTimeout(()=>rej(new Error('data channel test timed out')),15000))]);
  clearInterval(icePump);
  return true;
}
$('runBtn').addEventListener('click',()=>run().catch(e=>{setText('testState','failed'); logLine(e.message,'bad'); $('runBtn').disabled=false;}));
if(new URL(location.href).searchParams.get('autorun')==='1') setTimeout(()=>$('runBtn').click(),200);
</script></body></html>
