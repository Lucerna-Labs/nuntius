<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuntius Bridge Client</title><style>body{margin:0;background:#11151b;color:#e8edf2;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:940px;margin:0 auto;padding:32px 20px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{margin:0;font-size:28px;letter-spacing:0}.lede{margin:8px 0 0;color:#9aa7b5;max-width:640px}
.actions{display:flex;gap:10px;flex-wrap:wrap}button,a.btn{border:1px solid #2e3b49;background:#1d2630;color:#e8edf2;border-radius:6px;padding:10px 14px;text-decoration:none;cursor:pointer}
button.primary{background:#54d6c6;color:#071011;border-color:#54d6c6;font-weight:700}button:disabled{opacity:.55;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0}
.card{border:1px solid #25313d;background:#151b22;border-radius:8px;padding:14px;min-height:72px}
.label{color:#7f8d9c;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:20px;margin-top:7px;word-break:break-word}
.panel{border:1px solid #25313d;background:#151b22;border-radius:8px;padding:16px;margin-top:16px}
textarea,input{width:100%;box-sizing:border-box;border:1px solid #2e3b49;background:#0d1117;color:#e8edf2;border-radius:6px;padding:10px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
pre{min-height:260px;max-height:420px;overflow:auto;margin:0;white-space:pre-wrap;color:#b8c5d1;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.ok{color:#54d6c6}.warn{color:#f4c35a}.bad{color:#ff7979}
@media (max-width:760px){header{display:block}.actions{margin-top:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main>
<header><div><h1>Bridge client</h1><p class="lede">Finds an advertised bridge, creates a WebRTC session, then sends an AES-GCM encrypted test frame over the data channel.</p></div><div class="actions"><a class="btn" href="/admin/bridge">Admin</a><a class="btn" href="/bridge/worker" target="_blank">Open worker</a><button id="connectBtn" class="primary">Connect & test</button></div></header>
<section class="grid"><div class="card"><div class="label">Bridge ID</div><div id="bridgeId" class="value">-</div></div><div class="card"><div class="label">Session</div><div id="sessionId" class="value">-</div></div><div class="card"><div class="label">Peer</div><div id="peerState" class="value">idle</div></div><div class="card"><div class="label">Test</div><div id="testState" class="value">waiting</div></div></section>
<section class="panel"><label class="label" for="payload">Encrypted test payload</label><textarea id="payload" rows="4">Nuntius bridge test frame</textarea><div class="actions" style="margin-top:10px"><button id="sendBtn" disabled>Send encrypted frame</button></div></section>
<section class="panel"><pre id="log"></pre></section>
</main><script>
const $=id=>document.getElementById(id);
const logLine=(m,c='')=>{const el=$('log'); const t=new Date().toLocaleTimeString(); el.innerHTML+=`<span class="${c}">[${t}] ${m}</span>\n`; el.scrollTop=el.scrollHeight;};
const api=async(path,opts={})=>{const r=await fetch(path,{...opts,headers:{'content-type':'application/json',...(opts.headers||{})}}); if(!r.ok) throw new Error(`${path} ${r.status}`); if(r.status===204) return null; return r.json();};
let bridgeId=null, sessionId=null, pc=null, dc=null, bridgeIceNext=0, iceTimer=null, key=null, pending=new Map(), queuedClientIce=[];
function setText(id,v){$(id).textContent=v||'-';}
function pcConfig(){return {iceServers:[]};}
function requireWebRtc(){ if(typeof RTCPeerConnection!=='function') throw new Error('WebRTC RTCPeerConnection is not available in this browser'); }
const enc=new TextEncoder(), dec=new TextDecoder();
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function ensureKey(){ if(!key) key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']); return key; }
async function encryptText(text){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await ensureKey(),enc.encode(text)); return b64(new Uint8Array([...iv,...new Uint8Array(ct)])); }
async function decryptText(packet){ const bytes=unb64(packet); const iv=bytes.slice(0,12); const ct=bytes.slice(12); const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},await ensureKey(),ct); return dec.decode(pt); }
async function connect(){
  requireWebRtc();
  $('connectBtn').disabled=true; setText('testState','connecting');
  const bridges=await api('/api/bridge/bridges');
  const usable=bridges.filter(b=>b.transport==='webrtc-datachannel');
  if(!usable.length) throw new Error('no active bridges; open /bridge/worker and start it first');
  bridgeId=usable[0].bridge_id; setText('bridgeId',bridgeId); logLine(`using bridge ${bridgeId}`,'ok');
  pc=new RTCPeerConnection(pcConfig());
  pc.onconnectionstatechange=()=>setText('peerState',pc.connectionState);
  pc.onicecandidate=e=>{if(e.candidate) postClientIce(e.candidate.toJSON()).catch(err=>logLine(err.message,'bad'));};
  dc=pc.createDataChannel('nuntius-bridge',{ordered:true});
  wireChannel(dc);
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  const session=await api('/api/bridge/sessions',{method:'POST',body:JSON.stringify({bridge_id:bridgeId,ttl_secs:300,offer:{sdp_type:offer.type,sdp:offer.sdp}})});
  sessionId=session.session_id; setText('sessionId',sessionId); logLine(`created session ${sessionId}`,'ok');
  await flushClientIce();
  await waitForAnswer();
  iceTimer=setInterval(pollBridgeIce,800);
}
async function postClientIce(candidate){
  if(!sessionId){ queuedClientIce.push(candidate); return; }
  await api(`/api/bridge/sessions/${sessionId}/client-ice`,{method:'POST',body:JSON.stringify({candidate})});
}
async function flushClientIce(){
  const queued=queuedClientIce.splice(0);
  for(const candidate of queued) await postClientIce(candidate);
}
async function waitForAnswer(){
  for(let i=0;i<60;i++){
    const res=await api(`/api/bridge/sessions/${sessionId}/answer`);
    if(res.ready && res.answer){ await pc.setRemoteDescription({type:res.answer.sdp_type,sdp:res.answer.sdp}); for(const c of res.bridge_ice||[]) await pc.addIceCandidate(c).catch(()=>{}); return; }
    await new Promise(r=>setTimeout(r,500));
  }
  throw new Error('bridge did not answer in time');
}
async function pollBridgeIce(){
  if(!pc || !sessionId) return;
  const res=await api(`/api/bridge/sessions/${sessionId}/bridge-ice?from=${bridgeIceNext}`);
  bridgeIceNext=res.next;
  for(const c of res.candidates) await pc.addIceCandidate(c).catch(()=>{});
}
function wireChannel(ch){
  ch.onopen=()=>{logLine('data channel open','ok'); $('sendBtn').disabled=false; setText('testState','connected'); sendEncrypted().catch(e=>logLine(e.message,'bad'));};
  ch.onclose=()=>{logLine('data channel closed','warn'); $('sendBtn').disabled=true;};
  ch.onmessage=async e=>{
    let msg; try{msg=JSON.parse(e.data)}catch{logLine('non-json frame received','warn'); return;}
    if(msg.type==='ciphertext-echo'){
      const expected=pending.get(msg.id); pending.delete(msg.id);
      const clear=await decryptText(msg.bytes);
      const ok=clear===expected;
      setText('testState',ok?'passed':'failed');
      logLine(`encrypted frame ${msg.id} echoed; decrypt=${ok?'ok':'mismatch'}`, ok?'ok':'bad');
    }
  };
}
async function sendEncrypted(){
  if(!dc || dc.readyState!=='open') throw new Error('data channel is not open');
  const id=`frame-${Date.now()}`; const clear=$('payload').value || 'test'; const bytes=await encryptText(clear);
  pending.set(id,clear); dc.send(JSON.stringify({type:'ciphertext',id,bytes}));
  logLine(`sent encrypted frame ${id} (${bytes.length} chars)`);
}
$('connectBtn').addEventListener('click',()=>connect().catch(e=>{logLine(e.message,'bad'); setText('testState','failed'); $('connectBtn').disabled=false;}));
$('sendBtn').addEventListener('click',()=>sendEncrypted().catch(e=>logLine(e.message,'bad')));
</script></body></html>
