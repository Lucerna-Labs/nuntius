[package]
name = "ccc-plugin-s3"
version = "0.1.0"
edition = "2021"

[dependencies]
ccc-core = { path = "../core" }
ccc-database = { path = "../database" }

axum = { version = "0.7.9", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
askama = "0.12"
askama_axum = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Pure-Rust S3 client. Lighter than aws-sdk-s3, supports S3-compatible
# services (Cloudflare R2, Backblaze B2, MinIO) out of the box.
rust-s3 = { version = "0.34", default-features = false, features = ["tokio-rustls-tls"] }
